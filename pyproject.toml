# Tooling configuration only.
# Runtime dependencies live in requirements.txt / requirements-dev.txt
# and are intentionally not duplicated here.

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "D", "ANN", "RUF"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"**/__init__.py" = ["D104"]

[tool.ruff.lint.isort]
known-first-party = ["devmind"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
